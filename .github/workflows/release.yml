name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release from matching version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw 'Expected a vMAJOR.MINOR.PATCH tag'
          }
          ./tools/build_release.ps1 -Version $Matches[1]
      - uses: softprops/action-gh-release@v2
        with:
          name: DST Haptics Compatibility ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            build/release/dst_haptics_compat-*.zip
            build/release/dst_haptics_compat-*.zip.sha256
            build/release/preview.jpg
          fail_on_unmatched_files: true
