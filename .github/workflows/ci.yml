name: CI

on:
  push:
    branches: [main, "release/**", "codex/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Verify source and portable behavior
        run: python3 tools/verify.py --lua lua5.1 --report build/ci/verify.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: build/ci/verify.json
          if-no-files-found: error

  workshop-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Workshop package with an untracked scratch file present
        shell: pwsh
        run: |
          $scratch = Join-Path scripts ('scratch-' + [guid]::NewGuid().ToString('n') + '.lua')
          Set-Content -LiteralPath $scratch -Value '-- Local scratch file. The packager must exclude it.'
          ./tools/build_release.ps1
      - name: Check layout, reproducible output and artifact preservation
        shell: pwsh
        run: |
          $root = 'build/release'
          $files = @(Get-ChildItem -LiteralPath $root -File)
          $before = @{}
          foreach ($file in $files) { $before[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash }
          $refused = $false
          try { ./tools/build_release.ps1 } catch {
            if ($_.Exception.Message -notmatch 'Build output already exists') { throw }
            $refused = $true
          }
          if (-not $refused) { throw 'Existing artifacts were not protected' }
          foreach ($file in $files) {
            if ((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $before[$file.Name]) { throw 'Existing artifact changed' }
          }
          $zip = @(Get-ChildItem -LiteralPath $root -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected one release archive' }
          $expected = (Get-Content -LiteralPath ($zip[0].FullName + '.sha256') -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $packageFiles = @('modinfo.lua', 'modmain.lua', 'README.md', 'README.en.md', 'LICENSE', 'modicon.tex', 'modicon.xml')
            $packageFiles += @(git ls-files --cached -- scripts)
            $expectedNames = @($packageFiles | ForEach-Object { "dst_haptics_compat/$_" })
            if ($names.Count -ne $expectedNames.Count -or @(Compare-Object $expectedNames $names -CaseSensitive).Count -ne 0) {
              throw 'Unexpected or missing release content'
            }
          } finally { $archive.Dispose() }
          if ((Get-Item -LiteralPath (Join-Path $root 'preview.jpg')).Length -ge 1MB) { throw 'Preview is too large' }
          $repeat = 'build/repeated-package'
          (Get-Item -LiteralPath modmain.lua).LastWriteTime = [DateTime]::Now.AddDays(-7)
          foreach ($name in @('LICENSE', 'modicon.xml')) {
            $path = (Get-Item -LiteralPath $name).FullName
            $text = [IO.File]::ReadAllText($path)
            $text = $text.Replace([string][char]13 + [char]10, [string][char]10)
            [IO.File]::WriteAllText($path, $text.Replace([string][char]10, [string][char]13 + [char]10))
          }
          ./tools/build_release.ps1 -OutputRoot $repeat
          foreach ($file in $files) {
            $repeatFile = Join-Path $repeat $file.Name
            if ((Get-FileHash -LiteralPath $repeatFile -Algorithm SHA256).Hash -ne $before[$file.Name]) {
              throw "Rebuild produced a different artifact: $($file.Name)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dst-haptics-compat
          path: |
            build/release/dst_haptics_compat-*.zip
            build/release/dst_haptics_compat-*.zip.sha256
            build/release/preview.jpg
          if-no-files-found: error
